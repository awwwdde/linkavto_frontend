# nginx для витрины LINKAVTO: раздаём собранный SPA из /srv/web.
# Бэкенд не нужен — данные отдаёт MSW в браузере.
#   - слушаем 8080, наружу проксирует reverse proxy;
#   - /healthz → 200 для проб готовности;
#   - history API fallback: неизвестные пути → index.html (React Router);
#   - server_name _ : хост не фиксируем, доменов у проекта может быть несколько.
#
# TLS и HSTS — на стороне внешнего прокси; здесь только HTTP.

user  nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Логи в stdout/stderr — их забирает `docker logs`.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080 default_server;
        server_name _;

        root /srv/web;
        index index.html;

        # Заголовки безопасности задаём здесь, на внешний прокси не полагаемся.
        #
        # ВНИМАНИЕ: add_header не складывается по уровням — любой add_header
        # внутри location отменяет весь набор с уровня выше. Поэтому в каждом
        # location, где задаётся Cache-Control, набор повторяется целиком.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Хеш-именованные ассеты Vite — длинный иммутабельный кэш.
        location /assets/ {
            try_files $uri =404;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Сервис-воркер MSW не кэшируем — чтобы демо-моки обновлялись.
        location = /mockServiceWorker.js {
            try_files $uri =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache" always;
        }

        # index.html тоже без кэша: иначе после редеплоя браузер держит старый
        # документ со ссылками на снесённые хеш-ассеты и витрина «белеет».
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cache-Control "no-cache" always;
        }

        # Любой неизвестный путь — index.html (SPA-роутер разберётся сам).
        location / {
            try_files $uri /index.html;
        }
    }
}
